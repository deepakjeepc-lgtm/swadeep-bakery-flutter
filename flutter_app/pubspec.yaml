name: swadeep_bakery
description: "Swadeep Cake Shop & Restaurant - Production-Grade Flutter Mobile App"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Architecture & State Management
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4

  # Firebase Suite (Matching exact project ai-studio-swadeep-c9f5f4f9-12f6-4ef3-a3b0-884128973d8b)
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0
  firebase_storage: ^12.0.1

  # Local Persistence & Offline Resiliency
  shared_preferences: ^2.2.3

  # Network & Caching
  http: ^1.2.1
  cached_network_image: ^3.3.1

  # Polish, Motion & Micro-interactions
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  # Helpers & Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
